<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Crusader</title>
    <!-- Use a pixel-art font for the retro feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-size: 14px;
        }

        h1 {
            color: #ffcc00;
            text-shadow: 2px 2px #000;
        }

        /* Main container for the game layout */
        #game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            border: 4px solid #444;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* The game map area */
        #game-board {
            display: grid;
            /* Grid size will be set by JS */
            border: 4px solid #666;
            background-color: #333;
        }

        .tile {
            width: 32px;
            height: 32px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 32px;
            background-color: #444; /* Floor color */
        }

        .wall {
            background-color: #777; /* Wall color */
        }

        /* UI Panel for stats and messages */
        #ui-panel {
            width: 300px;
            height: 400px; /* Fixed height to match a 10x10 board */
            display: flex;
            flex-direction: column;
            border: 4px solid #666;
            background-color: #333;
            padding: 15px;
            box-sizing: border-box; /* Ensure padding doesn't break layout */
        }

        .stats-group {
            border-bottom: 2px dashed #555;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .stats-group h2 {
            font-size: 16px;
            color: #ffcc00;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #fff;
        }

        /* Message log at the bottom of the UI panel */
        #message-log {
            flex-grow: 1;
            background-color: #222;
            border: 2px solid #555;
            padding: 10px;
            overflow-y: auto;
            font-size: 10px;
            line-height: 1.5;
            margin-top: 10px;
        }

        #message-log p {
            margin: 0 0 5px 0;
        }

        /* Modal for Game Over / Win */
        #modal {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            z-index: 100;
            flex-direction: column;
            text-align: center;
        }

        #modal-content {
            background: #2a2a2a;
            padding: 40px;
            border: 4px solid #666;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #modal-message {
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 30px;
        }

        #restart-button {
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            padding: 15px 30px;
            background-color: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #b38f00;
            transition: all 0.1s ease;
        }

        #restart-button:active {
            box-shadow: none;
            transform: translateY(4px);
        }

        /* Instructions */
        #instructions {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>Tile Crusader</h1>

    <div id="game-container">
        <div id="game-board"></div>
        
        <div id="ui-panel">
            <!-- Player Stats -->
            <div class="stats-group">
                <h2>🦸 Player (Knight)</h2>
                <div class="stat">
                    <span class="stat-label">HP:</span>
                    <span class="stat-value" id="player-hp">--/--</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Attack:</span>
                    <span class="stat-value" id="player-attack">--</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Defense:</span>
                    <span class="stat-value" id="player-defense">--</span>
                </div>
            </div>

            <!-- Monster Stats -->
            <div class="stats-group">
                <h2>👹 Ork</h2>
                <div class="stat">
                    <span class="stat-label">HP:</span>
                    <span class="stat-value" id="monster-1-hp">--/--</span>
                </div>
            </div>
            <div class="stats-group">
                <h2>💀 Skeleton</h2>
                <div class="stat">
                    <span class="stat-label">HP:</span>
                    <span class="stat-value" id="monster-2-hp">--/--</span>
                </div>
            </div>
            
            <!-- Message Log -->
            <div id="message-log"></div>
        </div>
    </div>

    <div id="instructions">
        Use Arrow Keys to move. Move into enemies to attack.
    </div>

    <!-- Modal -->
    <div id="modal">
        <div id="modal-content">
            <div id="modal-message">Game Over!</div>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- DOM Elements ---
            const gameBoard = document.getElementById('game-board');
            const messageLog = document.getElementById('message-log');
            const modal = document.getElementById('modal');
            const modalMessage = document.getElementById('modal-message');
            const restartButton = document.getElementById('restart-button');

            // --- Game Constants ---
            const TILE_SIZE = 32; // px
            const TILE = {
                FLOOR: ' ',
                WALL: '🧱',
                PLAYER: '🦸',
                MONSTER_1: '👹',
                MONSTER_2: '💀',
                TREASURE: '🎁',
                POTION: '💖',
                EXIT: '🚪'
            };

            // --- Game State ---
            let map = [];
            let player = {};
            let monsters = [];
            let messages = [];
            let isGameOver = false;

            // --- Map Definition (10x10) ---
            const initialMap = [
                ['🧱','🧱','🧱','🧱','🧱','🧱','🧱','🧱','🧱','🧱'],
                ['🧱','🦸',' ',' ','🧱',' ',' ',' ','🎁','🧱'],
                ['🧱',' ','🧱',' ','🧱',' ','👹',' ',' ','🧱'],
                ['🧱',' ','🧱',' ',' ',' ','🧱',' ',' ','🧱'],
                ['🧱',' ',' ',' ','🧱',' ','🧱',' ','💖','🧱'],
                ['🧱','🧱','🧱',' ','🧱',' ','🧱','🧱','🧱','🧱'],
                ['🧱',' ',' ',' ','🧱',' ',' ',' ','💀','🧱'],
                ['🧱',' ','🧱',' ',' ',' ','🧱',' ',' ','🧱'],
                ['🧱',' ','🧱',' ','🧱',' ',' ',' ','🚪','🧱'],
                ['🧱','🧱','🧱','🧱','🧱','🧱','🧱','🧱','🧱','🧱']
            ];

            // --- Utility Functions ---
            
            /**
             * Adds a message to the log and scrolls to the bottom.
             */
            function addMessage(text, color = '#f0f0f0') {
                messages.unshift(`<p style="color:${color}">${text}</p>`);
                if (messages.length > 20) {
                    messages.pop();
                }
                messageLog.innerHTML = messages.join('');
            }

            /**
             * Finds the entity (player or monster) at a given coordinate.
             */
            function getEntityAt(x, y) {
                if (player.x === x && player.y === y) return player;
                return monsters.find(m => m.x === x && m.y === y);
            }

            /**
             * Finds a monster by its ID.
             */
            function getMonsterById(id) {
                return monsters.find(m => m.id === id);
            }

            // --- Game Logic ---

            /**
             * Initializes the game state from the map.
             */
            function initializeGame() {
                isGameOver = false;
                map = JSON.parse(JSON.stringify(initialMap)); // Deep copy
                monsters = [];
                messages = [];
                modal.style.display = 'none';

                const mapHeight = map.length;
                const mapWidth = map[0].length;

                // Setup game board grid
                gameBoard.style.gridTemplateColumns = `repeat(${mapWidth}, ${TILE_SIZE}px)`;
                gameBoard.style.gridTemplateRows = `repeat(${mapHeight}, ${TILE_SIZE}px)`;
                gameBoard.style.width = `${mapWidth * TILE_SIZE}px`;
                gameBoard.style.height = `${mapHeight * TILE_SIZE}px`;

                // Find player and monsters
                for (let y = 0; y < mapHeight; y++) {
                    for (let x = 0; x < mapWidth; x++) {
                        const tile = map[y][x];
                        if (tile === TILE.PLAYER) {
                            // From GDD: Knight (HP 9, Atk 3, Def 2)
                            player = {
                                id: 'player',
                                x: x,
                                y: y,
                                hp: 9,
                                maxHp: 9,
                                attack: 3,
                                defense: 2,
                                tile: TILE.PLAYER
                            };
                        } else if (tile === TILE.MONSTER_1) {
                            // From GDD: Ork (Monster 1). Stats are my interpretation.
                            monsters.push({
                                id: 'monster-1',
                                name: 'Ork',
                                x: x,
                                y: y,
                                hp: 6,
                                maxHp: 6,
                                attack: 2,
                                defense: 1,
                                tile: TILE.MONSTER_1
                            });
                        } else if (tile === TILE.MONSTER_2) {
                            // From GDD: Skeleton (Monster 7). Stats are my interpretation.
                            monsters.push({
                                id: 'monster-2',
                                name: 'Skeleton',
                                x: x,
                                y: y,
                                hp: 4,
                                maxHp: 4,
                                attack: 3,
                                defense: 0,
                                tile: TILE.MONSTER_2
                            });
                        }
                    }
                }
                
                addMessage("Welcome to Tile Crusader! Find the 🚪!");
                render();
            }

            /**
             * Renders the entire game state (map and UI).
             */
            function render() {
                // 1. Render Game Board
                gameBoard.innerHTML = '';
                for (let y = 0; y < map.length; y++) {
                    for (let x = 0; x < map[0].length; x++) {
                        const tileDiv = document.createElement('div');
                        tileDiv.classList.add('tile');
                        
                        const tileType = map[y][x];
                        let content = tileType;

                        // Clear floor tiles
                        if (tileType === TILE.FLOOR) {
                            content = ' ';
                        }
                        // Add wall class for styling
                        if (tileType === TILE.WALL) {
                            tileDiv.classList.add('wall');
                        }

                        tileDiv.textContent = content;
                        gameBoard.appendChild(tileDiv);
                    }
                }

                // 2. Render UI Stats
                // Player
                document.getElementById('player-hp').textContent = `${player.hp}/${player.maxHp}`;
                document.getElementById('player-attack').textContent = player.attack;
                document.getElementById('player-defense').textContent = player.defense;

                // Monster 1 (Ork)
                const m1 = getMonsterById('monster-1');
                const m1hp = document.getElementById('monster-1-hp');
                if (m1) {
                    m1hp.textContent = `${m1.hp}/${m1.maxHp}`;
                    m1hp.style.color = m1.hp < m1.maxHp ? '#ff6b6b' : '#fff';
                } else {
                    m1hp.textContent = "DEFEATED";
                    m1hp.style.color = '#555';
                }

                // Monster 2 (Skeleton)
                const m2 = getMonsterById('monster-2');
                const m2hp = document.getElementById('monster-2-hp');
                if (m2) {
                    m2hp.textContent = `${m2.hp}/${m2.maxHp}`;
                    m2hp.style.color = m2.hp < m2.maxHp ? '#ff6b6b' : '#fff';
                } else {
                    m2hp.textContent = "DEFEATED";
                    m2hp.style.color = '#555';
                }
            }

            /**
             * Handles combat between two entities.
             */
            function handleCombat(attacker, defender) {
                // Per GDD: "If the attack value is higher than the defending value, 
                // the difference is subtracted from the defending character's life."
                let damage = Math.max(0, attacker.attack - defender.defense);
                defender.hp -= damage;
                
                const attName = attacker.id === 'player' ? 'You' : `The ${attacker.name}`;
                const defName = defender.id === 'player' ? 'you' : `the ${defender.name}`;
                const color = attacker.id === 'player' ? '#6bff6b' : '#ff6b6b';

                if (damage > 0) {
                    addMessage(`${attName} hit ${defName} for ${damage} damage!`, color);
                } else {
                    addMessage(`${attName} attack ${defName} but it's ineffective!`, color);
                }

                // Check for death
                if (defender.hp <= 0) {
                    handleDeath(defender);
                }
            }
            
            /**
             * Handles the death of an entity.
             */
            function handleDeath(entity) {
                if (entity.id === 'player') {
                    // Game Over
                    addMessage("You have been defeated!", "#ff2222");
                    map[entity.y][entity.x] = '💀'; // Show player's skull
                    isGameOver = true;
                    showModal("Game Over!");
                } else {
                    // Monster died
                    addMessage(`You defeated the ${entity.name}!`, "#ffcc00");
                    // Remove from map and monsters array
                    map[entity.y][entity.x] = TILE.FLOOR;
                    monsters = monsters.filter(m => m.id !== entity.id);
                }
            }

            /**
             * Attempts to move the player to a new position.
             */
            function movePlayer(newX, newY) {
                const targetTile = map[newY][newX];
                
                let monsterToAttack = monsters.find(m => m.x === newX && m.y === newY);

                if (targetTile === TILE.WALL) {
                    addMessage("You bump into a solid wall.");
                    return; // Can't move
                
                } else if (monsterToAttack) {
                    // --- Combat Turn ---
                    // 1. Player attacks monster
                    handleCombat(player, monsterToAttack);
                    
                    // 2. Monster attacks player (if still alive)
                    if (monsterToAttack.hp > 0) {
                        handleCombat(monsterToAttack, player);
                    }
                    
                } else {
                    // --- Movement Turn ---
                    
                    // Handle special tiles
                    if (targetTile === TILE.TREASURE) {
                        player.attack += 1;
                        addMessage("You found a 🎁! Attack +1.", "#6bffff");
                    } else if (targetTile === TILE.POTION) {
                        player.hp = player.maxHp;
                        addMessage("You drank a 💖! HP restored.", "#ff6bff");
                    } else if (targetTile === TILE.EXIT) {
                        addMessage("You found the exit! You win!", "#ffcc00");
                        isGameOver = true;
                        showModal("You Escaped!");
                        return; // Stop here, don't update map
                    }

                    // Move player on the map
                    map[player.y][player.x] = TILE.FLOOR;
                    player.x = newX;
                    player.y = newY;
                    map[player.y][player.x] = TILE.PLAYER;
                }
                
                // Re-render the game state
                render();
            }

            /**
             * Displays the game over/win modal.
             */
            function showModal(message) {
                modalMessage.textContent = message;
                modal.style.display = 'flex';
            }

            // --- Event Listeners ---
            
            /**
             * Handles keyboard input for player movement.
             */
            function handleKeyDown(e) {
                if (isGameOver) return;

                let newX = player.x;
                let newY = player.y;

                switch (e.key) {
                    case 'ArrowUp':
                        newY--;
                        break;
                    case 'ArrowDown':
                        newY++;
                        break;
                    case 'ArrowLeft':
                        newX--;
                        break;
                    case 'ArrowRight':
                        newX++;
                        break;
                    default:
                        return; // Not a valid move key
                }
                
                e.preventDefault(); // Stop window from scrolling
                movePlayer(newX, newY);
            }

            document.addEventListener('keydown', handleKeyDown);
            restartButton.addEventListener('click', initializeGame);

            // --- Start Game ---
            initializeGame();
        });
    </script>
</body>
</html>
